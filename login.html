
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login · Ben's Lab</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #070711;
            --card: #10101e;
            --primary: #8b5cf6;
            --secondary: #6366f1;
            --text: #f8fafc;
            --muted: #9292ad;
            --border: rgba(255, 255, 255, 0.09);
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            background: var(--bg);
            color: var(--text);
            position: relative;
        }

        /* Animated background */

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            z-index: -1;
            pointer-events: none;
        }

        body::before {
            background: #7c3aed;
            top: -180px;
            left: -150px;
            animation: floatOne 10s ease-in-out infinite alternate;
        }

        body::after {
            background: #4f46e5;
            bottom: -180px;
            right: -150px;
            animation: floatTwo 12s ease-in-out infinite alternate;
        }

        @keyframes floatOne {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(100px, 100px);
            }
        }

        @keyframes floatTwo {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(-100px, -80px);
            }
        }

        /* Main container */

        .auth-container {
            width: 100%;
            max-width: 430px;
            animation: fadeUp 0.8s ease forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Brand */

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            background: linear-gradient(
                90deg,
                #c4b5fd,
                #8b5cf6,
                #6366f1
            );
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s linear infinite;
        }

        @keyframes gradientMove {
            to {
                background-position: 200% center;
            }
        }

        .brand p {
            color: var(--muted);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Login card */

        .card {
            position: relative;
            padding: 38px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: rgba(16, 16, 30, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.45),
                0 0 40px rgba(139, 92, 246, 0.07);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.5),
                0 0 45px rgba(139, 92, 246, 0.12);
        }

        .card h2 {
            font-size: 27px;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Inputs */

        .input-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #d4d4e5;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 15px 16px;
            border: 1px solid #29293d;
            border-radius: 12px;
            outline: none;
            background: #0b0b16;
            color: var(--text);
            font-size: 14px;
            transition:
                border-color 0.3s,
                box-shadow 0.3s,
                transform 0.3s;
        }

        input::placeholder {
            color: #65657d;
        }

        input:hover {
            border-color: #484064;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.13);
            transform: translateY(-2px);
        }

        /* Login button */

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                var(--primary),
                var(--secondary)
            );
            color: white;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition:
                transform 0.3s,
                box-shadow 0.3s,
                opacity 0.3s;
        }

        button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.25),
                transparent
            );
            transition: left 0.6s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.35);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Messages */

        .message {
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
            min-height: 20px;
            overflow-wrap: anywhere;
        }

        .message:not(:empty) {
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Signup link */

        .signup-link {
            text-align: center;
            margin-top: 27px;
            color: var(--muted);
            font-size: 13px;
        }

        .signup-link a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
            transition: color 0.3s;
        }

        .signup-link a:hover {
            color: #c4b5fd;
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            color: #55556c;
            font-size: 11px;
            margin-top: 25px;
        }

        /* Mobile */

        @media (max-width: 500px) {
            .card {
                padding: 27px 23px;
                border-radius: 20px;
            }

            .brand h1 {
                font-size: 32px;
            }

            .card h2 {
                font-size: 24px;
            }
        }

        /* Accessibility */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <div class="brand">
            <h1>Ben's Lab</h1>
            <p>AI Business Advisor</p>
        </div>

        <div class="card">

            <h2>Welcome Back</h2>
            <p class="subtitle">
                Login to your Ben's Lab account.
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="loginBtn">
                    Login to Account
                </button>

                <div
                    class="message"
                    id="message"
                    role="status"
                    aria-live="polite"
                ></div>

            </form>

            <div class="signup-link">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </div>

        </div>

        <div class="footer">
            © 2026 Ben's Lab · AI Business Advisor
        </div>

    </div>

    <script type="module">

        import { auth } from "./firebase-config.js";

        import {
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const button = document.getElementById("loginBtn");

        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "";
            button.disabled = true;
            button.textContent = "Authenticating...";

            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                message.style.color = "#34d399";
                message.textContent = "Login successful! Redirecting...";

                button.textContent = "Success!";

                setTimeout(() => {
                    window.location.href = "ai.html";
                }, 700);

            } catch (error) {

                message.style.color = "#fb7185";

                if (
                    error.code === "auth/invalid-credential" ||
                    error.code === "auth/wrong-password" ||
                    error.code === "auth/user-not-found"
                ) {
                    message.textContent =
                        "Incorrect email or password.";
                }
                else if (error.code === "auth/invalid-email") {
                    message.textContent =
                        "Please enter a valid email.";
                }
                else if (error.code === "auth/too-many-requests") {
                    message.textContent =
                        "Too many attempts. Please try again later.";
                }
                else {
                    message.textContent =
                        "Login failed. Please try again.";
                    console.error("Login error:", error);
                }

                button.disabled = false;
                button.textContent = "Login to Account";

            }

        });

    </script>

</body>
</html>
